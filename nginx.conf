server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(json|js|css|svg|png|jpg|jpeg|ico|webp|mp3)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
}
